<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JesterPCs — Users</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          th:href="@{/css/shared.css}">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<header class="jp_header jp_admin-header">

    <a href="/admin" class="jp_logo">
        <span class="jp_logo-jester">Jester</span><span class="jp_logo-pcs">PCs</span>
    </a>

    <nav class="jp_nav">

        <div class="jp_nav-list">

            <a href="/admin" class="jp_nav-link">
                Dashboard
            </a>

            <a href="/admin/products" class="jp_nav-link">
                Products
            </a>

            <a href="/admin/orders" class="jp_nav-link">
                Orders
            </a>

            <a href="/admin/users" class="jp_nav-link">
                Users
            </a>

            <a href="/admin/categories" class="jp_nav-link">
                Categories
            </a>

        </div>

        <div class="jp_nav-actions">

            <a href="/" class="jp_nav-login">
                Site
            </a>

            <a href="/logout" class="jp_nav-login">
                Logout
            </a>

        </div>

    </nav>

</header>


<main class="jp_admin-page">

    <div class="jp_admin-heading">

        <p class="jp_admin-label">
            Admin
        </p>

        <h1>
            User Management
        </h1>

    </div>


    <div class="jp_admin-table-card">

        <div class="jp_admin-table-wrap">

            <table class="jp_admin-table">

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Email Status</th>
                    <th>Role</th>
                </tr>

                </thead>


                <tbody>

                <tr th:each="u : ${users}">

                    <td th:text="${u.userId}">
                        1
                    </td>

                    <td th:text="${u.fullName}">
                        User Name
                    </td>

                    <td th:text="${u.username}">
                        username
                    </td>

                    <td th:text="${u.email}">
                        email@example.com
                    </td>

                    <td>

                        <span class="jp_user-verified"
                              th:classappend="${u.emailVerified} ? ' verified' : ' unverified'"
                              th:text="${u.emailVerified} ? 'Verified' : 'Not Verified'">
                            Verified
                        </span>

                    </td>

                    <td>

                        <span class="jp_user-role"
                              th:classappend="${u.role == 'ADMIN'} ? ' admin' : ' user'"
                              th:text="${u.role}">
                            USER
                        </span>

                    </td>

                </tr>


                <tr th:if="${#lists.isEmpty(users)}">

                    <td colspan="6"
                        class="jp_no-orders">

                        No users found.

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>


<footer class="jp_footer jp_admin-footer">

    <div class="jp_footer-bar">
        JesterPCs Admin Panel
    </div>

</footer>

</body>
</html>
