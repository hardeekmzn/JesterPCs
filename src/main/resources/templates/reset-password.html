<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JesterPCs — Reset Password</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/shared.css}">
    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>
<body>

<div id="jp_header-mount"></div>

<main class="jp_page">

    <div class="jp_side">
        <img th:src="@{/images/forsignup.jpg}" alt="Gaming PC Setup" class="jp_side-img">
        <div class="jp_side-overlay"></div>
    </div>

    <div class="jp_form-panel">
        <div class="jp_form-card">

            <div class="jp_form-header">
                <h1 class="jp_form-title">Reset Password</h1>
                <p class="jp_form-sub">Create a new password</p>
            </div>

            <p class="jp_form-error"
               th:if="${error}"
               th:text="${error}"></p>

            <form class="jp_form"
                  th:if="${token}"
                  th:action="@{/reset-password}"
                  method="post">

                <input type="hidden"
                       name="token"
                       th:value="${token}">

                <div class="jp_field">
                    <label for="password">New Password</label>

                    <div class="jp_input-wrap">
                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Enter new password"
                               required />

                        <i class="fa-solid fa-lock jp_input-icon"></i>
                    </div>
                </div>

                <div class="jp_field">
                    <label for="confirmPassword">Confirm Password</label>

                    <div class="jp_input-wrap">
                        <input type="password"
                               id="confirmPassword"
                               name="confirmPassword"
                               placeholder="Confirm new password"
                               required />

                        <i class="fa-solid fa-lock jp_input-icon"></i>
                    </div>
                </div>

                <button type="submit" class="jp_submit">
                    Reset Password
                </button>

            </form>

            <a href="/login"
               style="display:block; text-align:center; margin-top:16px;">
                Back to Sign In
            </a>

        </div>
    </div>

</main>

<div id="jp_footer-mount"></div>

<script th:src="@{/js/components.js}"></script>
<script>
    initHeader(null);
    initFooter();
</script>

</body>
</html>
