<div id="jp-confirm-modal" class="jp-confirm-modal" aria-hidden="true">
    <div class="jp-confirm-backdrop"></div>

    <div class="jp-confirm-box"
         role="dialog"
         aria-modal="true"
         aria-labelledby="jp-confirm-title">

        <button type="button"
                class="jp-confirm-close"
                id="jp-confirm-close"
                aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="jp-confirm-icon">
            <i class="fa-solid fa-trash"></i>
        </div>

        <h2 id="jp-confirm-title">
            Are you sure?
        </h2>

        <p id="jp-confirm-message">
            This action cannot be undone.
        </p>

        <div class="jp-confirm-actions">

            <button type="button"
                    class="jp-confirm-cancel"
                    id="jp-confirm-cancel">
                Cancel
            </button>

            <button type="button"
                    class="jp-confirm-delete"
                    id="jp-confirm-delete">
                Delete
            </button>

        </div>

    </div>
</div>
